{% extends 'base.html' %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-3">Recuperar contraseña</h3>
      <p class="text-muted">Escribe tu usuario. Se enviará una solicitud al director para que autorice el restablecimiento.</p>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <button class="btn btn-primary w-100" type="submit">Enviar solicitud</button>
      </form>
      <p class="mt-3 mb-0"><a href="{{ url_for('login') }}">Volver al inicio de sesión</a></p>
    </div>
  </div>
</div>
{% endblock %}
